name: Build

on:
  pull_request:
    branches:
      - main+
  workflow_dispatch:
  release:
    types:
      - created

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        goos: [linux, windows, darwin]
        goarch: [amd64, 386, arm64]
    env:
      CGO_ENABLED: 0
      ARTIFACT_NAME: real-voice-limiter-${{ matrix.goos }}-${{ matrix.goarch }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v2
        with:
          go-version: 1.17

      - name: Get dependencies
        run: go mod download

      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: go build -v -o build/${{ env.ARTIFACT_NAME }}

      - name: Archive artifacts
        uses: actions/upload-artifact@v4
        with:
          path: build/*
          if-no-files-found: warn
